<style> 
  :root{
    --bg:#10171A; --surface:#1B2528; --surface2:#212C30;
    --accent:#34D399; --warm:#FFB454; --debt:#FF6B6B;
    --text:#EAF2EF; --muted:#8FA39D; --border:#28353A;
  }
  body[data-theme="light"]{
    --bg:#F5F7F6; --surface:#FFFFFF; --surface2:#FFFFFF;
    --accent:#0E9F6E; --warm:#D97F0A; --debt:#DC2626;
    --text:#10171A; --muted:#6B7B77; --border:#E1E7E4;
  }
  body[data-theme="light"] .topbar{background:linear-gradient(180deg,#FFFFFF 0%, #F5F7F6 100%); box-shadow:0 1px 0 rgba(0,0,0,0.03);}
  body[data-theme="light"] .bottomnav{background:#FFFFFF;}
  body[data-theme="light"] .card, body[data-theme="light"] .month-block, body[data-theme="light"] .acct-card{box-shadow:0 1px 3px rgba(16,23,26,0.06);}
  body[data-theme="light"] .code-box{background:#F0F2F1; color:#0E9F6E;}
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);}
  #root{margin:0;padding:0;}
  .app{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans Bengali","Hind Siliguri",Roboto,sans-serif;
    background:var(--bg); color:var(--text);
    max-width:430px; margin:0 auto; min-height:100vh;
    display:flex; flex-direction:column; position:relative; overflow-x:hidden;
  }
  @keyframes logoPulse{0%,100%{transform:scale(1);opacity:1;} 50%{transform:scale(1.1);opacity:0.72;}}
  .loading-screen{display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column;gap:16px;}
  .loading-logo{width:84px;height:84px;border-radius:22px;animation:logoPulse 1.3s ease-in-out infinite;box-shadow:0 0 34px rgba(52,211,153,0.35);}
  .topbar{padding:20px 20px 16px;background:linear-gradient(180deg,#141C1F 0%, #10171A 100%);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5;}
  .topbar .brandrow{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .topbar .brand{display:flex;align-items:center;gap:10px;min-width:0;}
  .topbar .brand img{width:30px;height:30px;border-radius:9px;flex-shrink:0;}
  .topbar h1{font-size:18px;margin:0;font-weight:700;letter-spacing:0.2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .topbar .sub{color:var(--muted);font-size:13px;margin-top:4px;display:flex;align-items:center;gap:6px;}
  .synkdot{width:7px;height:7px;border-radius:50%;background:var(--accent);display:inline-block;}
  .icon-btn{background:none;border:none;color:var(--muted);font-size:19px;cursor:pointer;padding:4px 6px;flex-shrink:0;}
  .icon-btn:hover{color:var(--text);}
  .back-btn{
    width:34px;height:34px;border-radius:11px;border:1px solid var(--border);
    background:var(--surface);color:var(--text);font-size:16px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;
  }
  .back-btn:active{background:var(--surface2);}
  .fab-settings{
    position:fixed;bottom:20px;right:20px;
    width:52px;height:52px;border-radius:16px;
    background:var(--surface2);border:1px solid var(--border);color:var(--text);
    font-size:21px;display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 18px rgba(0,0,0,0.25);cursor:pointer;z-index:11;
  }
  .fab-settings.raised{bottom:88px;}
  .fab-settings:active{transform:scale(0.94);}
  .hub-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:8px 0 4px;}
  .hub-item{display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px 6px;cursor:pointer;}
  .hub-item .hic{width:44px;height:44px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:20px;}
  .hub-item .hlabel{font-size:11.5px;font-weight:600;text-align:center;color:var(--text);}
  .hub-back{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;cursor:pointer;margin-bottom:14px;}
  .content{flex:1;padding:16px 16px 100px;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:18px;margin-bottom:14px;}
  .ring-wrap{display:flex;align-items:center;gap:18px;}
  .ring-labels{flex:1;}
  .ring-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;}
  .ring-row .name{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);}
  .ring-row .swatch{width:10px;height:10px;border-radius:3px;}
  .ring-row .amt{font-variant-numeric:tabular-nums;font-weight:700;font-size:15px;}
  .balance-banner{margin-top:10px;padding:14px 16px;border-radius:14px;display:flex;align-items:center;gap:12px;}
  .balance-banner.owe{background:rgba(255,107,107,0.12);border:1px solid rgba(255,107,107,0.35);}
  .balance-banner.even{background:rgba(143,163,157,0.12);border:1px solid var(--border);}
  .balance-banner .icon{font-size:22px;}
  .balance-banner .txt{font-size:14.5px;line-height:1.4;}
  .balance-banner .txt b{font-variant-numeric:tabular-nums;}
  .section-title{font-size:13px;color:var(--muted);margin:22px 4px 10px;font-weight:600;letter-spacing:0.3px;display:flex;justify-content:space-between;align-items:center;}
  .entry{display:flex;align-items:center;gap:12px;padding:12px 6px;border-bottom:1px solid var(--border);}
  .entry:last-child{border-bottom:none;}
  .entry .avatar{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0;}
  .entry .info{flex:1;min-width:0;}
  .entry .desc{font-size:14.5px;font-weight:600;}
  .entry .meta{font-size:12px;color:var(--muted);margin-top:2px;}
  .entry .amt{font-variant-numeric:tabular-nums;font-weight:700;font-size:15px;}
  .entry .del{background:none;border:none;color:var(--muted);font-size:16px;padding:6px;cursor:pointer;opacity:0.6;}
  .entry .del:hover{opacity:1;color:var(--debt);}
  .empty{text-align:center;padding:40px 20px;color:var(--muted);font-size:14px;}
  .empty .big{font-size:32px;margin-bottom:8px;}
  .bottomnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:#141C1F;border-top:1px solid var(--border);display:flex;padding:10px 10px calc(10px + env(safe-area-inset-bottom));z-index:10;}
  .navbtn{flex:1;background:none;border:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;padding:6px 0;cursor:pointer;font-family:inherit;}
  .navbtn .ic{font-size:20px;}
  .navbtn.active{color:var(--accent);}
  .fab{position:fixed;bottom:78px;left:50%;transform:translateX(calc(-50% + 145px));width:58px;height:58px;border-radius:18px;background:var(--accent);color:#08201A;border:none;font-size:28px;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(52,211,153,0.4);cursor:pointer;z-index:11;}
  .sheet-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:fadeIn 0.2s ease;overflow-y:auto;}
  @keyframes fadeIn{from{opacity:0} to{opacity:1}}
  .sheet{background:var(--surface2);width:100%;max-width:430px;border-radius:22px 22px 0 0;padding:10px 20px 28px;animation:slideUp 0.25s cubic-bezier(.2,.8,.2,1);max-height:92vh;overflow-y:auto;}
  @keyframes slideUp{from{transform:translateY(30px);opacity:0} to{transform:translateY(0);opacity:1}}
  .sheet-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:6px auto 16px;}
  .sheet h2{font-size:17px;margin:0 0 16px;}
  .sheet h3{font-size:13.5px;color:var(--muted);margin:20px 0 10px;text-transform:uppercase;letter-spacing:0.4px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px;font-weight:600;}
  .field input{width:100%;background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:12px;padding:12px 14px;font-size:15px;font-family:inherit;}
  .field input:focus{outline:none;border-color:var(--accent);}
  .payer-toggle{display:flex;gap:10px;flex-wrap:wrap;}
  .payer-toggle button{flex:1;min-width:90px;padding:14px;border-radius:12px;border:1.5px solid var(--border);background:var(--surface);color:var(--text);font-family:inherit;font-size:14.5px;font-weight:600;cursor:pointer;}
  .chip-row{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{padding:8px 12px;border-radius:20px;border:1.5px solid var(--border);background:var(--surface);color:var(--text);font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;}
  .btn-primary{width:100%;padding:15px;border-radius:14px;border:none;background:var(--accent);color:#08201A;font-weight:700;font-size:15px;cursor:pointer;font-family:inherit;margin-top:6px;}
  .btn-ghost{width:100%;padding:13px;border-radius:14px;border:1px solid var(--border);background:none;color:var(--muted);font-weight:600;font-size:14px;cursor:pointer;font-family:inherit;margin-top:8px;}
  .btn-row{display:flex;gap:10px;}
  .btn-row .btn-ghost{margin-top:0;}
  .month-block{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:14px;}
  .month-block .mtitle{font-weight:700;font-size:15px;display:flex;justify-content:space-between;align-items:center;}
  .month-block .mstat{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:10px;padding-top:10px;border-top:1px solid var(--border);}
  .cat-bar-row{margin-bottom:10px;}
  .cat-bar-track{height:8px;background:var(--border);border-radius:4px;overflow:hidden;margin-top:4px;}
  .cat-bar-fill{height:100%;border-radius:4px;}
  .receipt-thumb{width:28px;height:28px;border-radius:8px;object-fit:cover;border:1px solid var(--border);cursor:pointer;}
  .photo-modal{position:fixed;inset:0;background:rgba(0,0,0,0.9);z-index:40;display:flex;align-items:center;justify-content:center;padding:20px;}
  .photo-modal img{max-width:100%;max-height:100%;border-radius:12px;}
  .photo-modal .closebtn{position:absolute;top:20px;right:20px;background:var(--surface2);border:none;color:var(--text);width:36px;height:36px;border-radius:50%;font-size:18px;cursor:pointer;}
  .viewer-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);font-size:14px;gap:8px;}
  .viewer-row:last-child{border-bottom:none;}
  .lang-row{display:flex;gap:8px;}
  .lang-btn{flex:1;padding:10px;border-radius:12px;border:1.5px solid var(--border);background:var(--surface);color:var(--text);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;}
  .lang-btn.sel{border-color:var(--accent);background:rgba(52,211,153,0.12);color:var(--accent);}
  .toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--surface2);color:var(--text);padding:11px 20px;border-radius:12px;font-size:13.5px;border:1px solid var(--border);z-index:30;max-width:90%;text-align:center;animation:fadeIn 0.2s ease;}
  .setup-warning{margin:16px 0;padding:16px;background:rgba(255,180,84,0.12);border:1px solid rgba(255,180,84,0.4);border-radius:14px;font-size:13.5px;line-height:1.6;}
  .setup-warning code{background:#0c1214;padding:2px 6px;border-radius:6px;font-size:12px;}
  .code-box{background:#0c1214;border:1px solid var(--border);border-radius:10px;padding:12px;font-size:10.5px;line-height:1.6;color:#9FE8C9;white-space:pre-wrap;word-break:break-all;margin-top:8px;}
  .acct-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px;margin-bottom:12px;display:flex;align-items:center;gap:12px;cursor:pointer;}
  .acct-card .aic{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0;}
  .acct-card .ainfo{flex:1;min-width:0;}
  .acct-card .aname{font-size:14.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .acct-card .arole{font-size:11.5px;color:var(--muted);margin-top:2px;}
  .role-badge{font-size:10.5px;padding:3px 8px;border-radius:8px;font-weight:700;}
  .type-toggle{display:flex;gap:10px;}
  .type-toggle button{flex:1;padding:16px 10px;border-radius:14px;border:1.5px solid var(--border);background:var(--surface);color:var(--text);font-family:inherit;cursor:pointer;text-align:center;}
  .type-toggle button.sel{border-color:var(--accent);background:rgba(52,211,153,0.12);}
  .type-toggle .ticon{font-size:24px;display:block;margin-bottom:6px;}
  .type-toggle .tlabel{font-size:13px;font-weight:700;}
  .pct-row{display:flex;align-items:center;gap:10px;padding:8px 0;}
  .pct-row input{width:70px;text-align:center;}
</style>

<!-- ===================== FIREBASE SETUP =====================
  ১) https://console.firebase.google.com এ ফ্রি প্রজেক্ট বানান
  ২) Build → Realtime Database → Create Database → Start in test mode
  ৩) Build → Authentication → Sign-in method → Google → Enable
  ৪) Project settings → General → Your apps → Web (</>) → Register app
  ৫) firebaseConfig থেকে নিচের FIREBASE_CONFIG এ apiKey/authDomain/databaseURL/projectId বসান
  ৬) হোস্টিং ডোমেইন Authentication → Settings → Authorized domains এ যোগ করুন
  ৭) Realtime Database → Rules এ এই নিয়ম বসান (মাল্টি-অ্যাকাউন্ট, bootstrap-safe):
  {
    "rules": {
      "accountsMeta": {
        ".read": "auth != null",
        "$accountId": {
          ".write": "auth != null && (!data.exists() || data.child('ownerEmail').val() == auth.token.email || (data.child('coEditorsList').val() != null && data.child('coEditorsList').val().contains('|' + auth.token.email + '|')))"
        }
      },
      "accounts": {
        "$accountId": {
          "expenses": {
            ".read": "auth != null && (root.child('accountsMeta/'+$accountId+'/ownerEmail').val() == auth.token.email || (root.child('accountsMeta/'+$accountId+'/coEditorsList').val() != null && root.child('accountsMeta/'+$accountId+'/coEditorsList').val().contains('|'+auth.token.email+'|')) || (root.child('accountsMeta/'+$accountId+'/viewerEmailsList').val() != null && root.child('accountsMeta/'+$accountId+'/viewerEmailsList').val().contains('|'+auth.token.email+'|')))",
            ".write": "auth != null && (root.child('accountsMeta/'+$accountId+'/ownerEmail').val() == auth.token.email || (root.child('accountsMeta/'+$accountId+'/coEditorsList').val() != null && root.child('accountsMeta/'+$accountId+'/coEditorsList').val().contains('|'+auth.token.email+'|')))"
          },
          "history": {
            ".read": "auth != null && (root.child('accountsMeta/'+$accountId+'/ownerEmail').val() == auth.token.email || (root.child('accountsMeta/'+$accountId+'/coEditorsList').val() != null && root.child('accountsMeta/'+$accountId+'/coEditorsList').val().contains('|'+auth.token.email+'|')) || (root.child('accountsMeta/'+$accountId+'/viewerEmailsList').val() != null && root.child('accountsMeta/'+$accountId+'/viewerEmailsList').val().contains('|'+auth.token.email+'|')))",
            ".write": "auth != null && (root.child('accountsMeta/'+$accountId+'/ownerEmail').val() == auth.token.email || (root.child('accountsMeta/'+$accountId+'/coEditorsList').val() != null && root.child('accountsMeta/'+$accountId+'/coEditorsList').val().contains('|'+auth.token.email+'|')))"
          }
        }
      },
      "expenses": { ".read": "auth != null", ".write": "auth != null" },
      "history": { ".read": "auth != null", ".write": "auth != null" },
      "config": { ".read": "auth != null", ".write": "auth != null" }
    }
  }
  (নিচের তিনটা লিগ্যাসি পাথ শুধু এক-বার মাইগ্রেশনের জন্য পড়া দরকার, মাইগ্রেশনের পর চাইলে এগুলোর রুল মুছেও দিতে পারবেন)
========================================================== -->

function parseCategories(str){
  if(!str) return DEFAULT_CATEGORIES_SEED.map(c=>({...c}));
  const list = str.split('|').filter(Boolean).map(entry=>{
    const parts = entry.split('~');
    return {id:parts[0], icon:parts[1]||'📦', label:parts[2]||parts[0], budget:parseFloat(parts[3])||0};
  });
  return list.length ? list : DEFAULT_CATEGORIES_SEED.map(c=>({...c}));
}
function stringifyCategories(list){
  return list.map(c=> c.id+'~'+c.icon+'~'+c.label+'~'+(c.budget||0)).join('|');
}

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function todayStr(){return new Date().toISOString().slice(0,10);}
function fmtDate(d){
  const dt = new Date(d);
  const months = ["জানু","ফেব্রু","মার্চ","এপ্রিল","মে","জুন","জুলাই","আগস্ট","সেপ্ট","অক্টো","নভে","ডিসে"];
  return dt.getDate()+" "+months[dt.getMonth()];
}
function money(n){ return (Math.round(n*100)/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }

function parsePct(str, payerNames){
  const out = {};
  if(str){
    str.split('|').filter(Boolean).forEach(pair=>{
      const [n,p] = pair.split(':');
      if(n) out[n] = parseFloat(p)||0;
    });
  }
  const eq = payerNames.length>0 ? 100/payerNames.length : 0;
  payerNames.forEach(n=>{ if(!(n in out)) out[n] = eq; });
  return out;
}
function stringifyPct(obj){
  return Object.keys(obj).map(n=> n+':'+obj[n]).join('|');
}

function compressImage(file, cb){
  const reader = new FileReader();
  reader.onload = (ev)=>{
    const img = new Image();
    img.onload = ()=>{
      const maxW = 700;
      const scale = Math.min(1, maxW/img.width);
      const canvas = document.createElement('canvas');
      canvas.width = img.width*scale;
      canvas.height = img.height*scale;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img,0,0,canvas.width,canvas.height);
      cb(canvas.toDataURL('image/jpeg',0.55));
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

function computeSettlements(byPayerObj, payerNames, shareObj, total){
  const cred = payerNames.map(n=>({name:n, diff:(byPayerObj[n]||0)-(total*(shareObj[n]||0)/100)})).filter(b=>b.diff>0.004).sort((a,b)=>b.diff-a.diff);
  const debt = payerNames.map(n=>({name:n, diff:(byPayerObj[n]||0)-(total*(shareObj[n]||0)/100)})).filter(b=>b.diff<-0.004).sort((a,b)=>a.diff-b.diff);
  const out = [];
  let ci=0, di=0;
  while(ci<cred.length && di<debt.length){
    const c = cred[ci], d = debt[di];
    const amt = Math.min(c.diff, -d.diff);
    if(amt>0.004) out.push({from:d.name, to:c.name, amount:amt});
    c.diff -= amt; d.diff += amt;
    if(c.diff<=0.004) ci++;
    if(d.diff>=-0.004) di++;
  }
  return out;
}

function exportCSV(monthLabel, entries){
  const header = 'Date,Category,Description,Paid by,Amount\n';
  const rows = entries.map(e=> [e.date, (e.category||''), '"'+(e.desc||'').replace(/"/g,'""')+'"', (e.payer||''), e.amount].join(',')).join('\n');

  a.href = url; a.download = 'hisab-'+monthLabel.replace(/\s+/g,'-')+'.csv';

        <div className="topbar"><div className="brand"><img src="icon-192.png"/><h1>হিসাব</h1></div></div>
        <div className="content" style={{display:'flex',alignItems:'center',justifyContent:'center',minHeight:'70vh'}}>
          <div className="card" style={{textAlign:'center'}}>
            <div style={{fontSize:40,marginBottom:10}}>🔒</div>
            <div style={{fontWeight:700,fontSize:16,marginBottom:14}}>{t('pinEnterTitle')}</div>
            <input type="password" inputMode="numeric" maxLength="4" value={pinInput} autoFocus
              onChange={e=>{ setPinInput(e.target.value); setPinError(''); }}
              style={{width:'100%',textAlign:'center',fontSize:22,letterSpacing:8,background:'var(--surface)',border:'1px solid var(--border)',color:'var(--text)',borderRadius:12,padding:'12px'}}/>
            {pinError && <div style={{color:'var(--debt)',fontSize:12.5,marginTop:10}}>{t('pinWrong')}</div>}
            <button className="btn-primary" onClick={()=>{
              if(pinInput===pin){ setPinLocked(false); setPinInput(''); }
              else { setPinError(t('pinWrong')); setPinInput(''); }
            }}>{t('unlockBtn')}</button>
          </div>
        </div>
      </div>
    );
  }

  // ============ Account selector screen ============
  if(!currentAccountId){
    return (
      <div className="app" dir={lang==='ar'?'rtl':'ltr'}>
        <div className="topbar">
          <div className="brandrow">
            <div className="brand"><img src="icon-192.png"/><h1>{t('myAccounts')}</h1></div>
          </div>
          <div className="sub">{user.email}</div>
        </div>
        <div className="content" style={{paddingBottom:100}}>
          {!metaLoaded && <div className="empty">…</div>}
          {metaLoaded && myAccounts.length>0 && (
            <div className="field">
              <input value={accountSearch} onChange={e=>setAccountSearch(e.target.value)} placeholder={t('searchAccountsPh')}/>
            </div>
          )}
          {metaLoaded && myAccounts.length===0 && (
            <div className="empty"><div className="big">📂</div>{t('noEntries')}</div>
          )}

          {(() => {
            const q = accountSearch.trim().toLowerCase();
            const matchedAccounts = myAccounts.filter(id=> (accountsMeta[id].name||'').toLowerCase().includes(q));
            const matchedEntries = q==='' ? [] : myAccounts.flatMap(id=>{
              const m = accountsMeta[id];
              const list = allExpensesMap[id]||[];
              return list.filter(e=> (e.desc||'').toLowerCase().includes(q))
                .map(e=>({...e, accountId:id, accountName:m.name, accountCurrency:m.currency||DEFAULT_CURRENCY}));
            });

            if(myAccounts.length>0 && q!=='' && matchedAccounts.length===0 && matchedEntries.length===0){
              return <div className="empty"><div className="big">🔍</div>{t('noResults')}</div>;
            }

            return (
              <>
                {matchedAccounts.map(id=>{
                  const m = accountsMeta[id];
                  const role = roleFor(id);
                  const roleLabel = role==='owner'?t('owner'):role==='coeditor'?t('coeditor'):t('viewer');
                  const roleColor = role==='owner'?'#34D399':role==='coeditor'?'#60A5FA':'var(--muted)';
                  return (
                    <div className="acct-card" key={id} onClick={()=>openAccount(id)}>
                      <div className="aic" style={{background: (m.coverColor||(m.type==='shared'?'#FFB454':'#60A5FA'))+'22'}}>{m.coverIcon || (m.type==='shared'?'🤝':'👤')}</div>
                      <div className="ainfo">
                        <div className="aname">{m.name}</div>
                        <div className="arole">{m.type==='shared'?t('typeShared'):t('typePersonal')}</div>
                      </div>
                      <span className="role-badge" style={{background:roleColor+'22', color:roleColor}}>{roleLabel}</span>
                    </div>
                  );
                })}

                {matchedEntries.length>0 && (
                  <div className="card" style={{padding:'6px 12px'}}>
                    {matchedEntries.map(e=>(
                      <div className="entry" key={e.accountId+'-'+e.id} onClick={()=>openAccount(e.accountId)} style={{cursor:'pointer'}}>
                        <div className="avatar" style={{background:'#8FA39D22', color:'var(--muted)'}}>{(e.accountName||'?')[0]}</div>
                        <div className="info">
                          <div className="desc">{e.desc}</div>
                          <div className="meta">{e.accountName} · {fmtDate(e.date)}</div>
                        </div>
                        <div className="amt">{e.accountCurrency}{money(e.amount)}</div>
                      </div>
                    ))}
                  </div>
                )}
              </>
            );
          })()}

          <button className="btn-primary" onClick={()=>setCreateOpen(true)}>{t('createAccount')}</button>
        </div>

        <button className="fab-settings" onClick={()=>{setHubView('grid'); setSettingsOpen(true);}}>⚙️</button>

        {settingsOpen && (
          <div className="sheet-overlay" onClick={(e)=>{if(e.target===e.currentTarget) setSettingsOpen(false);}}>
            <div className="sheet">
              <div className="sheet-handle"></div>

              {hubView==='grid' && (
                <>
                  <h2>{t('settingsTitle')}</h2>
                  <div className="hub-grid">
                    <div className="hub-item" onClick={()=>setHubView('config')}>
                      <div className="hic" style={{background:'rgba(96,165,250,0.15)'}}>⚙️</div>
                      <div className="hlabel">{t('hubConfig')}</div>
                    </div>
                    <div className="hub-item" onClick={()=>setHubView('passcode')}>
                      <div className="hic" style={{background:'rgba(255,107,107,0.15)'}}>🔒</div>
                      <div className="hlabel">{t('hubPasscode')}</div>
                    </div>
                    <div className="hub-item" onClick={()=>setHubView('help')}>
                      <div className="hic" style={{background:'rgba(143,163,157,0.15)'}}>❓</div>
                      <div className="hlabel">{t('hubHelp')}</div>
                    </div>
                    <div className="hub-item" onClick={()=>setHubView('feedback')}>
                      <div className="hic" style={{background:'rgba(96,165,250,0.15)'}}>💌</div>
                      <div className="hlabel">{t('hubFeedback')}</div>
                    </div>
                    <div className="hub-item" onClick={()=>setHubView('recommend')}>
                      <div className="hic" style={{background:'rgba(52,211,153,0.15)'}}>👍</div>
                      <div className="hlabel">{t('hubRecommend')}</div>
                    </div>
                  </div>
                  <button className="btn-ghost" onClick={()=>window.__signOut()}>{t('signOut')}</button>
                  <button className="btn-ghost" onClick={()=>setSettingsOpen(false)}>{t('closeBtn')}</button>
                </>
              )}

              {hubView==='config' && (
                <>
                  <div className="hub-back" onClick={()=>setHubView('grid')}>{t('hubBack')}</div>
                  <h2>{t('hubConfig')}</h2>
                  <div className="field">
                    <label>{t('themeLabel')}</label>
                    <div className="lang-row">
                      <button className={"lang-btn "+(theme==='system'?'sel':'')} onClick={()=>changeTheme('system')}>⚙️ {t('themeSystem')}</button>
                      <button className={"lang-btn "+(theme==='dark'?'sel':'')} onClick={()=>changeTheme('dark')}>🌙 {t('themeDark')}</button>
                      <button className={"lang-btn "+(theme==='light'?'sel':'')} onClick={()=>changeTheme('light')}>☀️ {t('themeLight')}</button>
                    </div>
                  </div>
                  <div className="field">
                    <label>{t('languageLabel')}</label>
                    <div className="lang-row">
                      <button className={"lang-btn "+(lang==='bn'?'sel':'')} onClick={()=>changeLang('bn')}>বাংলা</button>
                      <button className={"lang-btn "+(lang==='en'?'sel':'')} onClick={()=>changeLang('en')}>English</button>
                      <button className={"lang-btn "+(lang==='ar'?'sel':'')} onClick={()=>changeLang('ar')}>العربية</button>
                    </div>
                  </div>
                  <button className="btn-ghost" onClick={()=>setHubView('grid')}>{t('closeBtn')}</button>
                </>
              )}

              {hubView==='passcode' && (
                <>
                  <div className="hub-back" onClick={()=>setHubView('grid')}>{t('hubBack')}</div>
                  <h2>{t('hubPasscode')}</h2>
                  {pin ? (
                    <div className="field">
                      <div style={{fontSize:13,color:'var(--muted)',marginBottom:10}}>🔒 PIN active</div>
                      <button className="btn-ghost" onClick={disablePin}>{t('pinDisable')}</button>
                    </div>
                  ) : (
                    <div className="field">
                      <label>{t('pinLabel')}</label>
                      <input type="password" inputMode="numeric" maxLength="4" value={pinSetupInput} onChange={e=>setPinSetupInput(e.target.value)} placeholder={t('pinSetPh')}/>
                      <button className="btn-primary" onClick={enablePin}>{t('pinEnable')}</button>
                    </div>
                  )}
                  <button className="btn-ghost" onClick={()=>setHubView('grid')}>{t('closeBtn')}</button>
                </>
              )}

              {hubView==='help' && (
                <>
                  <div className="hub-back" onClick={()=>setHubView('grid')}>{t('hubBack')}</div>
                  <h2>{t('hubHelp')}</h2>
                  <div style={{fontSize:14,color:'var(--muted)',lineHeight:1.6}}>{t('helpText')}</div>
                  <button className="btn-ghost" onClick={()=>setHubView('grid')}>{t('closeBtn')}</button>
                </>
              )}

              {hubView==='feedback' && (
                <>
                  <div className="hub-back" onClick={()=>setHubView('grid')}>{t('hubBack')}</div>
                  <h2>{t('hubFeedback')}</h2>
                  <div style={{fontSize:14,color:'var(--muted)',lineHeight:1.6,marginBottom:14}}>{t('feedbackText')}</div>
                  <a href={"mailto:"+LEGACY_OWNER_EMAIL+"?subject=Hisab%20App%20Feedback"} className="btn-primary" style={{display:'block',textAlign:'center',textDecoration:'none',boxSizing:'border-box'}}>✉️ Email</a>
                  <button className="btn-ghost" onClick={()=>setHubView('grid')}>{t('closeBtn')}</button>
                </>
              )}

              {hubView==='recommend' && (
                <>
                  <div className="hub-back" onClick={()=>setHubView('grid')}>{t('hubBack')}</div>
                  <h2>{t('hubRecommend')}</h2>
                  <div style={{fontSize:14,color:'var(--muted)',lineHeight:1.6,marginBottom:14}}>{t('recommendText')}</div>
                  <button className="btn-primary" onClick={()=>{
                    const link = window.location.origin + window.location.pathname;
                    if(navigator.share){ navigator.share({title:'হিসাব', url:link}).catch(()=>{}); }
                    else { navigator.clipboard.writeText(link).then(()=>showToast(t('linkCopied'))); }
                  }}>📤 Share</button>
                  <button className="btn-ghost" onClick={()=>setHubView('grid')}>{t('closeBtn')}</button>
                </>
              )}

            </div>
          </div>
        )}

        {createOpen && (
          <div className="sheet-overlay" onClick={(e)=>{if(e.target===e.currentTarget) setCreateOpen(false);}}>
            <div className="sheet">
              <div className="sheet-handle"></div>
              <h2>{t('createAccount')}</h2>
              <div className="field">
                <label>{t('accountName')}</label>
                <input value={newAccForm.name} onChange={e=>setNewAccForm({...newAccForm,name:e.target.value})} placeholder={t('accountNamePh')}/>
              </div>
              <div className="field">
                <label>{t('accountType')}</label>
                <div className="type-toggle">
                  <button className={newAccForm.type==='shared'?'sel':''} onClick={()=>setNewAccForm({...newAccForm,type:'shared'})}>
                    <span className="ticon">🤝</span><span className="tlabel">{t('typeShared')}</span>
                  </button>
                  <button className={newAccForm.type==='personal'?'sel':''} onClick={()=>setNewAccForm({...newAccForm,type:'personal'})}>
                    <span className="ticon">👤</span><span className="tlabel">{t('typePersonal')}</span>
                  </button>
                </div>
              </div>
              {newAccForm.type==='shared' && (
                <>
                  <div className="field"><label>{t('payerLabel')} ১</label><input value={newAccForm.payer1} onChange={e=>setNewAccForm({...newAccForm,payer1:e.target.value})} placeholder="Person 1"/></div>
                  <div className="field"><label>{t('payerLabel')} ২</label><input value={newAccForm.payer2} onChange={e=>setNewAccForm({...newAccForm,payer2:e.target.value})} placeholder="Person 2"/></div>
                </>
              )}
              <div className="field">
                <label>{t('currencyLabel')}</label>
                <div className="chip-row">
                  {['৳','﷼','$','₹','€'].map(sym=>(
                    <button key={sym} className="chip" style={newAccForm.currency===sym?{borderColor:'var(--accent)',background:'rgba(52,211,153,0.12)',color:'var(--accent)'}:{}} onClick={()=>setNewAccForm({...newAccForm,currency:sym})}>{sym}</button>
                  ))}
                </div>
              </div>
              <div className="field">
                <label>{t('coverIconLabel')}</label>
                <div className="chip-row">
                  {['🤝','👤',...ICON_PRESETS].map(ic=>(
                    <button key={ic} className="chip" style={{padding:'6px 9px',fontSize:16, ...((newAccForm.coverIcon||(newAccForm.type==='shared'?'🤝':'👤'))===ic?{borderColor:'var(--accent)'}:{})}} onClick={()=>setNewAccForm({...newAccForm,coverIcon:ic})}>{ic}</button>
                  ))}
                </div>
              </div>
              <div className="field">
                <label>{t('coverColorLabel')}</label>
                <div className="chip-row">
                  {PALETTE.map(col=>(
                    <button key={col} className="chip" style={{padding:'6px 14px', background:col, borderColor: newAccForm.coverColor===col?'var(--text)':col}} onClick={()=>setNewAccForm({...newAccForm,coverColor:col})}></button>
                  ))}
                </div>
              </div>
              <button className="btn-primary" onClick={createAccount}>{t('createBtn')}</button>
              <button className="btn-ghost" onClick={()=>setCreateOpen(false)}>{t('cancelBtn')}</button>
            </div>
          </div>
        )}
        {toast && <div className="toast">{toast}</div>}
      </div>
    );
  }

  // ============ Inside an account ============
  const sortedExpenses = [...expenses].sort((a,b)=> sortOrder==='oldest'
    ? (a.date.localeCompare(b.date) || a.id.localeCompare(b.id))
    : (b.date.localeCompare(a.date) || b.id.localeCompare(a.id)));
  const total = expenses.reduce((s,e)=>s+e.amount,0);
  const totalExpenseOnly = expenses.filter(e=>e.kind!=='income').reduce((s,e)=>s+e.amount,0);
  const totalIncomeOnly = expenses.filter(e=>e.kind==='income').reduce((s,e)=>s+e.amount,0);
  const personalBalance = totalIncomeOnly - totalExpenseOnly;
  const byPayer = {};
  payerNames.forEach(n=> byPayer[n] = expenses.filter(e=>e.payer===n).reduce((s,e)=>s+e.amount,0));
  const settlements = isShared ? computeSettlements(byPayer, payerNames, sharePercents, total) : [];

  const R=42, C=2*Math.PI*R;
  let ringOffset = 0;
  const ringArcs = payerNames.map((n)=>{
    const amt = byPayer[n]||0;
    const frac = total>0 ? amt/total : (1/Math.max(payerNames.length,1));
    const len = C*frac;
    const arc = {n, len, offset: ringOffset};
    ringOffset += len;
    return arc;
  });

  const byCategory = categories.map(c=>({
    ...c,
    amt: expenses.filter(e=>(e.category||'other')===c.id && e.kind!=='income').reduce((sum,e)=>sum+e.amount,0)
  })).filter(c=>c.amt>0);

  const pctTotal = pctDraft ? Object.values(pctDraft).reduce((s,v)=>s+(parseFloat(v)||0),0) : 100;

  return (
    <div className="app" dir={lang==='ar'?'rtl':'ltr'}>
      <div className="topbar">
        <div className="brandrow">
          <div className="brand">
            <button className="back-btn" onClick={backToAccounts}>{lang==='ar'?'›':'‹'}</button>
            <h1>{meta.coverIcon || (isShared?'🤝':'👤')} {meta.name}</h1>
          </div>
        </div>
        <div className="sub"><span className="synkdot"></span>{canEdit ? t('editorMode') : t('viewerMode')}</div>
      </div>

      <div className="content">
        {tab==='home' && (
          <>
            {(() => {
              if(reminderDismissed || expenses.length===0) return null;
              const oldest = expenses.reduce((min,e)=> e.date<min?e.date:min, expenses[0].date);
              const daysSince = (Date.now() - new Date(oldest).getTime()) / 86400000;
              if(daysSince < 35) return null;
              return (
                <div className="card" style={{background:'rgba(255,180,84,0.1)',border:'1px solid rgba(255,180,84,0.35)'}}>
                  <div style={{fontSize:13,marginBottom:10}}>⏰ {t('reminderMsg')}</div>
                  <div className="btn-row">
                    {canEdit && <button className="btn-ghost" style={{margin:0}} onClick={()=>{setReminderDismissed(true); clearMonth();}}>{t('clearMonth')}</button>}
                    <button className="btn-ghost" style={{margin:0}} onClick={()=>setReminderDismissed(true)}>{t('dismissBtn')}</button>
                  </div>
                </div>
              );
            })()}
            <div className="card">
              {isShared ? (
                <div className="ring-wrap">
                  <svg width="100" height="100" viewBox="0 0 100 100">
                    <circle cx="50" cy="50" r={R} fill="none" stroke="#28353A" strokeWidth="10"/>
                    {ringArcs.map(a=>(
                      <circle key={a.n} cx="50" cy="50" r={R} fill="none" stroke={colorFor(a.n)} strokeWidth="10"
                        strokeDasharray={`${a.len} ${C-a.len}`} strokeDashoffset={-a.offset} strokeLinecap="round"
                        transform="rotate(-90 50 50)"/>
                    ))}
                    <text x="50" y="47" textAnchor="middle" fontSize="11" fill="var(--muted)">{t('totalLabel')}</text>
                    <text x="50" y="62" textAnchor="middle" fontSize="13" fontWeight="700" fill="var(--text)">{currency}{money(total)}</text>
                  </svg>
                  <div className="ring-labels">
                    {payerNames.map(n=>(
                      <div className="ring-row" key={n}>
                        <div className="name"><span className="swatch" style={{background:colorFor(n)}}></span>{n} ({Math.round(sharePercents[n]||0)}%)</div>
                        <div className="amt">{currency}{money(byPayer[n]||0)}</div>
                      </div>
                    ))}
                  </div>
                </div>
              ) : (
                <div>
                  <div style={{display:'flex',gap:10}}>
                    <div style={{flex:1,textAlign:'center',padding:'10px 6px',background:'rgba(52,211,153,0.1)',borderRadius:12}}>
                      <div style={{color:'var(--accent)',fontSize:11,fontWeight:600}}>⬆️ {t('totalIncome')}</div>
                      <div style={{fontSize:16,fontWeight:700,marginTop:4}}>{currency}{money(totalIncomeOnly)}</div>
                    </div>
                    <div style={{flex:1,textAlign:'center',padding:'10px 6px',background:'rgba(255,107,107,0.1)',borderRadius:12}}>
                      <div style={{color:'var(--debt)',fontSize:11,fontWeight:600}}>⬇️ {t('totalExpenseWord')}</div>
                      <div style={{fontSize:16,fontWeight:700,marginTop:4}}>{currency}{money(totalExpenseOnly)}</div>
                    </div>
                  </div>
                  <div style={{textAlign:'center',marginTop:14}}>
                    <div style={{color:'var(--muted)',fontSize:12}}>{t('currentBalance')}</div>
                    <div style={{fontSize:28,fontWeight:700,marginTop:4,color:personalBalance>=0?'var(--accent)':'var(--debt)'}}>{currency}{money(personalBalance)}</div>
                  </div>
                </div>
              )}

              {isShared && settlements.length===0 && (
                <div className="balance-banner even"><div className="icon">✅</div><div className="txt">{t('balanceEven')}</div></div>
              )}
              {isShared && settlements.map((s,i)=>(
                <div className="balance-banner owe" key={i}><div className="icon">↔️</div><div className="txt">{s.from} → {s.to}: <b>{currency}{money(s.amount)}</b></div></div>
              ))}
            </div>

            <div className="section-title">
              <span>{t('recentEntries')}</span>
              {expenses.length>0 && (
                <span style={{display:'flex',gap:10}}>
                  <button className="icon-btn" style={{fontSize:14}} onClick={()=>exportExcel('current', expenses, total)}>📊</button>
                  <button className="icon-btn" style={{fontSize:14}} onClick={()=>exportCSV('current', expenses)}>📄</button>
                  <button className="icon-btn" style={{fontSize:14}} onClick={()=>exportPrint('current', expenses, total, currency)}>🖨️</button>
                </span>
              )}
            </div>
            <div className="card" style={{padding:'6px 12px'}}>
              {expenses.length===0 && <div className="empty"><div className="big">🧾</div>{t('noEntries')}<br/>{t('noEntriesSub')}</div>}
              {sortedExpenses.slice(0,6).map(e=>{
                const c = catById(e.category||'other');
                return (
                  <div className="entry" key={e.id}>
                    <div className="avatar" style={{background:(colorFor(e.payer)||'var(--muted)')+'22', color:colorFor(e.payer)||'var(--muted)'}}>{isShared ? (e.payer||'?')[0] : c.icon}</div>
                    <div className="info">
                      <div className="desc">{c.icon} {e.desc}</div>
                      <div className="meta">{isShared?(e.payer+' · '):''}{fmtDate(e.date)}</div>
                    </div>
                    {e.receipt && <img className="receipt-thumb" src={e.receipt} onClick={()=>setViewingPhoto(e.receipt)}/>}
                    <div className="amt" style={!isShared?{color: e.kind==='income'?'var(--accent)':'var(--debt)'}:{}}>{!isShared && (e.kind==='income'?'+':'-')}{currency}{money(e.amount)}</div>
                    {canEdit && <button className="del" onClick={()=>openEditSheet(e)}>✏️</button>}
                    {canEdit && <button className="del" onClick={()=>deleteExpense(e.id)}>✕</button>}
                  </div>
                );
              })}
            </div>
            {canEdit && expenses.length>0 && <button className="btn-ghost" onClick={clearMonth}>{t('clearMonth')}</button>}
          </>
        )}

        {tab==='list' && (
          <>
            <div className="section-title">
              <span>{t('allExpenses')} ({expenses.length})</span>
              <button className="icon-btn" style={{fontSize:14, border:'1px solid var(--border)', borderRadius:10, padding:'6px 10px'}} onClick={()=>setFilterOpen(true)}>🎚️ {t('filterBtn')}</button>
            </div>
            <div className="field">
              <input value={expenseSearch} onChange={e=>setExpenseSearch(e.target.value)} placeholder={t('searchExpensePh')}/>
            </div>
            <div className="card" style={{padding:'6px 12px'}}>
              {(() => {
                const activeCats = categoryFilterSet || new Set(categories.map(c=>c.id));
                const activePayers = payerFilterSet || new Set(payerNames);
                const filtered = sortedExpenses.filter(e=>
                  activeCats.has(e.category||'other') &&
                  (!isShared || activePayers.has(e.payer)) &&
                  (expenseSearch.trim()==='' || e.desc.toLowerCase().includes(expenseSearch.trim().toLowerCase()))
                );
                if(expenses.length===0) return <div className="empty"><div className="big">📋</div>{t('noEntry')}</div>;
                if(filtered.length===0) return <div className="empty"><div className="big">🔍</div>{t('noResults')}</div>;
                return filtered.map(e=>{
                const c = catById(e.category||'other');
                return (
                  <div className="entry" key={e.id}>
                    <div className="avatar" style={{background:(colorFor(e.payer)||'var(--muted)')+'22', color:colorFor(e.payer)||'var(--muted)'}}>{isShared ? (e.payer||'?')[0] : c.icon}</div>
                    <div className="info">
                      <div className="desc">{c.icon} {e.desc}</div>

                          <input type="number" value={newCatBudget} onChange={e=>setNewCatBudget(e.target.value)} placeholder={t('budgetPh')} style={{width:80}}/>
                          <button className="icon-btn" onClick={()=>{
                            const updated = categories.map(cc=> cc.id===c.id ? {...cc, icon:newCatIcon, label:newCatLabel||cc.label, budget:parseFloat(newCatBudget)||0} : cc);
                            saveCategoryList(updated);
                            setEditingCatId(null);
                          }}>💾</button>
                        </>
                      ) : (
                        <>
                          <span>{c.icon} {c.label}{c.budget>0 && <span style={{color:'var(--muted)',fontSize:11}}> · {t('budgetLabel')} {currency}{money(c.budget)}</span>}</span>
                          <span style={{display:'flex',gap:6}}>
                            <button className="icon-btn" onClick={()=>{ setEditingCatId(c.id); setNewCatIcon(c.icon); setNewCatLabel(c.label); setNewCatBudget(c.budget?String(c.budget):''); }}>✏️</button>
                            <button className="icon-btn" onClick={()=>{
                              if(categories.length<=1){ showToast('⚠️ min 1'); return; }
                              askConfirm(t('confirmDeleteExpense'), ()=> saveCategoryList(categories.filter(cc=>cc.id!==c.id)));
                            }}>✕</button>
                          </span>
                        </>
                      )}
                    </div>
                  ))}
                  <div style={{marginTop:10}}>
                    <div className="chip-row" style={{marginBottom:8}}>
                      {ICON_PRESETS.map(ic=>(
                        <button key={ic} className="chip" style={{padding:'4px 8px',fontSize:15, ...(newCatIcon===ic && !editingCatId?{borderColor:'var(--accent)'}:{})}} onClick={()=>setNewCatIcon(ic)}>{ic}</button>
                      ))}
                    </div>
                    <div style={{display:'flex',gap:8}}>
                      <input value={editingCatId?'':newCatLabel} onChange={e=>setNewCatLabel(e.target.value)} placeholder={t('categoryNamePh')}/>
                      <button className="btn-ghost" style={{margin:0,width:'auto',padding:'10px 16px'}} onClick={()=>{
                        if(!newCatLabel.trim()) return;
                        saveCategoryList([...categories, {id:uid(), icon:newCatIcon, label:newCatLabel.trim()}]);
                        setNewCatLabel(''); setNewCatIcon('📦');
                      }}>{t('addBtnShort')}</button>
                    </div>
                  </div>
                </div>
                <button className="btn-ghost" onClick={()=>setHubView('grid')}>{t('closeBtn')}</button>
              </>
            )}

            {hubView==='passcode' && (
              <>
                <div className="hub-back" onClick={()=>setHubView('grid')}>{t('hubBack')}</div>
                <h2>{t('hubPasscode')}</h2>
                {pin ? (
                  <div className="field">
                    <div style={{fontSize:13,color:'var(--muted)',marginBottom:10}}>🔒 PIN active</div>
                    <button className="btn-ghost" onClick={disablePin}>{t('pinDisable')}</button>
                  </div>
                ) : (
                  <div className="field">
                    <label>{t('pinLabel')}</label>
                    <input type="password" inputMode="numeric" maxLength="4" value={pinSetupInput} onChange={e=>setPinSetupInput(e.target.value)} placeholder={t('pinSetPh')}/>
                    <button className="btn-primary" onClick={enablePin}>{t('pinEnable')}</button>
                  </div>
                )}
                <button className="btn-ghost" onClick={()=>setHubView('grid')}>{t('closeBtn')}</button>
              </>
            )}

            {hubView==='backup' && (
              <>
                <div className="hub-back" onClick={()=>setHubView('grid')}>{t('hubBack')}</div>
                <h2>{t('hubBackup')}</h2>
                <button className="btn-ghost" onClick={exportBackup}>{t('backupExport')}</button>
                {isOwner && (
                  <div className="field" style={{marginTop:10}}>
                    <label>{t('backupImport')}</label>
                    <input type="file" accept="application/json" onChange={e=>{ const f=e.target.files[0]; if(f) importBackup(f); }}/>
                  </div>
                )}
                <button className="btn-ghost" onClick={()=>setHubView('grid')}>{t('closeBtn')}</button>
              </>
            )}

            {hubView==='help' && (
              <>
                <div className="hub-back" onClick={()=>setHubView('grid')}>{t('hubBack')}</div>
                <h2>{t('hubHelp')}</h2>
                <div style={{fontSize:14,color:'var(--muted)',lineHeight:1.6}}>{t('helpText')}</div>
                <button className="btn-ghost" onClick={()=>setHubView('grid')}>{t('closeBtn')}</button>
              </>
            )}

            {hubView==='feedback' && (
              <>
                <div className="hub-back" onClick={()=>setHubView('grid')}>{t('hubBack')}</div>
                <h2>{t('hubFeedback')}</h2>
                <div style={{fontSize:14,color:'var(--muted)',lineHeight:1.6,marginBottom:14}}>{t('feedbackText')}</div>
                <a href={"mailto:"+LEGACY_OWNER_EMAIL+"?subject=Hisab%20App%20Feedback"} className="btn-primary" style={{display:'block',textAlign:'center',textDecoration:'none',boxSizing:'border-box'}}>✉️ Email</a>
                <button className="btn-ghost" onClick={()=>setHubView('grid')}>{t('closeBtn')}</button>
              </>
            )}

            {hubView==='recommend' && (
              <>
                <div className="hub-back" onClick={()=>setHubView('grid')}>{t('hubBack')}</div>
                <h2>{t('hubRecommend')}</h2>
                <div style={{fontSize:14,color:'var(--muted)',lineHeight:1.6,marginBottom:14}}>{t('recommendText')}</div>
                <button className="btn-primary" onClick={()=>{
                  const link = window.location.origin + window.location.pathname;
                  if(navigator.share){ navigator.share({title:'হিসাব', url:link}).catch(()=>{}); }
                  else { navigator.clipboard.writeText(link).then(()=>showToast(t('linkCopied'))); }
                }}>📤 Share</button>
                <button className="btn-ghost" onClick={()=>setHubView('grid')}>{t('closeBtn')}</button>
              </>
            )}

          </div>
        </div>
      )}

      {confirmState && (
        <div className="sheet-overlay" onClick={()=>setConfirmState(null)}>
          <div className="sheet" onClick={e=>e.stopPropagation()}>
            <div className="sheet-handle"></div>
            <h2>⚠️ {confirmState.message}</h2>
            <button className="btn-primary" style={{background:'var(--debt)'}} onClick={()=>{ confirmState.onConfirm(); setConfirmState(null); }}>{t('confirmYes')}</button>
            <button className="btn-ghost" onClick={()=>setConfirmState(null)}>{t('cancelBtn')}</button>
          </div>
        </div>
      )}

      {viewingPhoto && (
        <div className="photo-modal" onClick={()=>setViewingPhoto(null)}>
          <button className="closebtn" onClick={()=>setViewingPhoto(null)}>✕</button>
          <img src={viewingPhoto}/>
        </div>
      )}

      {toast && <div className="toast">{toast}</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>

<script>
  if('serviceWorker' in navigator){
    window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
  }
</script>
</body>
</html>
